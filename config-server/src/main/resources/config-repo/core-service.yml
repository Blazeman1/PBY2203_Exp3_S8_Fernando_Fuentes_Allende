spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring resuelve automaticamente el JWK Set de auth-server a partir de este issuer
          # (via /.well-known/oauth-authorization-server), sin necesidad de fijar a mano la
          # URL del endpoint de claves publicas.
          issuer-uri: http://localhost:9000

kafka:
  topics:
    transferencias-solicitadas: bancoxyz.transferencias.solicitadas
    transferencias-debito-aplicado: bancoxyz.transferencias.debito-aplicado
    transferencias-resultado: bancoxyz.transferencias.resultado
